# Secrets (fitpulse-secrets) are generated by scripts/k8s/bootstrap.sh and never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fitpulse-config
data:
  ENVIRONMENT: staging
  BUSINESS_TIMEZONE: Asia/Kolkata
  CORS_ORIGINS: http://localhost:30080
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  QR_TOKEN_EXPIRE_SECONDS: "60"
