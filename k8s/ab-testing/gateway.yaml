apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-gateway
data:
  default.conf.template: |
    upstream a { server ab-api-a:8000; }
    upstream b { server ab-api-b:8000; }

    # New visitors are split 50/50; the cookie then keeps each one in their group.
    # B_RULE is "50% b;" during the experiment and empty once it has been stopped.
    split_clients "${request_id}" $assigned {
        ${B_RULE}
        * a;
    }
    map $cookie_ab_group $sticky {
        a       a;
        b       ${STICKY_B};
        default $assigned;
    }
    # Testers can force a group with "X-AB-Group: a|b".
    map $http_x_ab_group $group {
        a       a;
        b       b;
        default $sticky;
    }

    server {
        listen 8080;
        location = /gateway-health {
            access_log off;
            return 200;
        }
        location / {
            proxy_pass http://$group;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Set-Cookie "ab_group=$group; Path=/; Max-Age=2592000; HttpOnly; SameSite=Lax" always;
            add_header X-AB-Group $group always;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ab-gateway
spec:
  type: NodePort
  selector:
    app: ab-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ab-gateway
spec:
  replicas: 1
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: ab-gateway
  template:
    metadata:
      labels:
        app: ab-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: B_RULE
              value: "50% b;"
            - name: STICKY_B
              value: b
          readinessProbe:
            httpGet: {path: /gateway-health, port: 8080}
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: [sleep, "6"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi, ephemeral-storage: 64Mi}
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
      volumes:
        - name: templates
          configMap:
            name: ab-gateway
