apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: fitpulse-frontend
  ports:
    - port: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: fitpulse-frontend
  template:
    metadata:
      labels:
        app: fitpulse-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: fitpulse-web:APP_VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi, ephemeral-storage: 64Mi}
