apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-gateway
data:
  default.conf.template: |
    upstream stable { server canary-api-stable:8000; }
    upstream canary { server canary-api-canary:8000; }

    # CANARY_RULE is e.g. "10% canary;" and empty when the canary is off.
    split_clients "${request_id}" $weighted {
        ${CANARY_RULE}
        * stable;
    }
    # "X-Canary: always" lets the pipeline test the canary before users see it.
    map $http_x_canary $backend {
        always  canary;
        never   stable;
        default $weighted;
    }

    server {
        listen 8080;
        location = /gateway-health {
            access_log off;
            return 200;
        }
        location / {
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: canary-gateway
spec:
  type: NodePort
  selector:
    app: canary-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-gateway
spec:
  replicas: 1
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: canary-gateway
  template:
    metadata:
      labels:
        app: canary-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CANARY_RULE
              value: ""
          readinessProbe:
            httpGet: {path: /gateway-health, port: 8080}
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: [sleep, "6"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi, ephemeral-storage: 64Mi}
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
      volumes:
        - name: templates
          configMap:
            name: canary-gateway
