apiVersion: v1
kind: Service
metadata:
  name: shadow-api-stable
  labels:
    strategy: shadow
spec:
  type: ClusterIP
  selector:
    app: fitpulse-api
    strategy: shadow
    track: stable
  ports:
    - port: 8000
      targetPort: http
---
# NodePort only so the pipeline can smoke-test the shadow directly.
apiVersion: v1
kind: Service
metadata:
  name: shadow-api-shadow
  labels:
    strategy: shadow
spec:
  type: NodePort
  selector:
    app: fitpulse-api
    strategy: shadow
    track: shadow
  ports:
    - port: 8000
      targetPort: http
      nodePort: 30087
