apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fitpulse
nameSuffix: -shadow-shadow
resources:
  - ../../api-base
labels:
  - includeSelectors: true
    pairs:
      strategy: shadow
      track: shadow
replicas:
  - name: api
    count: 1
patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/key
        value: SHADOW_DATABASE_URL
