apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-gateway
data:
  default.conf.template: |
    upstream stable { server shadow-api-stable:8000; }
    upstream shadow { server shadow-api-shadow:8000; }

    server {
        listen 8080;
        location = /gateway-health {
            access_log off;
            return 200;
        }
        location / {
            mirror /_shadow;
            mirror_request_body on;
            proxy_pass http://stable;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Response is discarded; short timeouts so a sick shadow cannot hurt users.
        location = /_shadow {
            internal;
            proxy_pass http://shadow$request_uri;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Shadow-Request "1";
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: shadow-gateway
spec:
  type: NodePort
  selector:
    app: shadow-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow-gateway
spec:
  replicas: 1
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: shadow-gateway
  template:
    metadata:
      labels:
        app: shadow-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /gateway-health, port: 8080}
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: [sleep, "6"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi, ephemeral-storage: 64Mi}
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
      volumes:
        - name: templates
          configMap:
            name: shadow-gateway
