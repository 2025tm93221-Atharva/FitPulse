apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: fitpulse-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fitpulse-api
  template:
    metadata:
      labels:
        app: fitpulse-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: fitpulse-api:APP_VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fitpulse-config
          env:
            - name: DEPLOY_TRACK
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['track']
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: fitpulse-secrets, key: SECRET_KEY}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fitpulse-secrets, key: DATABASE_URL}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              # Keep serving while the Service stops routing here: no dropped requests.
              exec:
                command: [sleep, "6"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 80Mi}
            limits: {memory: 192Mi, ephemeral-storage: 64Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
