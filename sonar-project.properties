sonar.projectKey=fitpulse
sonar.projectName=FitPulse
sonar.sources=backEnd/app,frontEnd/src
sonar.tests=backEnd/tests,backEnd/smoke
sonar.python.version=3.14
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
# The React UI has no unit tests; it is analysed but not counted in coverage.
sonar.coverage.exclusions=frontEnd/**
sonar.sourceEncoding=UTF-8
