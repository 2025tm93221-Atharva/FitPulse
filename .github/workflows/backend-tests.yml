name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test -t fitpulse-api:test backEnd
      - name: Run tests inside the image
        run: docker run --rm fitpulse-api:test
