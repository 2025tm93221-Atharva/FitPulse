name: Backend tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Validate fresh database migrations and ORM schema
        env:
          PYTHONPATH: .
        run: |
          db_file="/tmp/fitness-migration-${{ matrix.python-version }}.db"
          rm -f "$db_file"
          export DATABASE_URL="sqlite:////tmp/fitness-migration-${{ matrix.python-version }}.db"
          alembic upgrade head
          alembic check
