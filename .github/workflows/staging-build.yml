name: Staging image build

on:
  push:
  pull_request:

jobs:
  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare placeholder staging environment
        run: |
          cat > .env.staging <<EOF
          ENVIRONMENT=staging
          POSTGRES_DB=fitness
          POSTGRES_USER=fitness_app
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          SECRET_KEY=$(openssl rand -hex 32)
          EOF
      - name: Validate Compose configuration
        run: docker compose --env-file .env.staging -f compose.staging.yml config --quiet
      - name: Build staging images
        run: docker compose --env-file .env.staging -f compose.staging.yml build
