name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontEnd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontEnd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend syntax, tests, and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backEnd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backEnd/poetry.lock

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --no-interaction --sync

      - name: Lint Python
        uses: astral-sh/ruff-action@v3
        with:
          args: --select E4,E7,E9,F
          src: >-
            backEnd/app
            backEnd/migrations
            backEnd/tests

      - name: Check Python syntax
        run: poetry run python -m compileall -q app migrations tests

      - name: Run backend tests
        run: poetry run pytest -q

      - name: Validate migrations against a fresh database
        env:
          DATABASE_URL: sqlite:////tmp/fitpulse-ci-migrations.db
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backEnd
          push: false
          tags: fitpulse-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontEnd
          push: false
          tags: fitpulse-frontend:ci
          build-args: |
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
