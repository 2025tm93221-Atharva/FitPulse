services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.staging}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - api_db

  migrate:
    build:
      context: ./backEnd
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - api_db

  api:
    build:
      context: ./backEnd
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend_api
      - api_db

  frontend:
    build:
      context: ./frontEnd
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${STAGING_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - frontend_api

volumes:
  postgres_data:

networks:
  edge:
  frontend_api:
    internal: true
  api_db:
    internal: true
