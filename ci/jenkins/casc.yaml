jenkins:
  systemMessage: FitPulse CI/CD (configured as code, see ci/jenkins/casc.yaml)
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: sonar-token
              scope: GLOBAL
              secret: ${SONAR_TOKEN:-unset}
          - usernamePassword:
              id: dockerhub
              scope: GLOBAL
              username: ${DOCKERHUB_USER:-unset}
              password: ${DOCKERHUB_TOKEN:-unset}
unclassified:
  location:
    url: http://localhost:8090/
jobs:
  - script: >
      pipelineJob('fitpulse') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_URL}') }
                branch('*/${GIT_BRANCH}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
        properties {
          pipelineTriggers {
            triggers { pollSCM { scmpoll_spec('H/2 * * * *') } }
          }
        }
      }
