[project]
name = "fitpulse-backend"
version = "1"
description = "Backend API and core service engine for the Fitness Membership Application, handling user authentication, digital QR check-ins, and subscription tiers"
authors = [
    {name = "Atharva Kadam"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
