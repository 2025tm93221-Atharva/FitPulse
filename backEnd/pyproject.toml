[project]
name = "fitpulse-backend"
version = "1.0.0"
description = "Backend API and core service engine for the Fitness Membership Application, handling user authentication, digital QR check-ins, and subscription tiers"
authors = [
    {name = "Atharva Kadam"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "psycopg[binary] (>=3.2,<4.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=6.0,<8.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
relative_files = true
branch = true
